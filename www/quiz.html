<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>QuickMath - 在线答题</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">速算答题</h2>
    <div class="mb-2">
        <span id="timer" class="badge bg-info text-dark">00:00</span>
        <button class="btn btn-secondary btn-sm ms-2" onclick="location.reload()">刷新页面</button>
    </div>
    <form id="quiz-form" autocomplete="off">
        <div id="questions-list">
            <!-- 题目将由 JS 动态生成 -->
        </div>
        <div class="d-flex justify-content-center mt-3">
            <button type="submit" class="btn btn-success w-25">交卷！</button>
        </div>
        <div style="height: 2.5rem;"></div>
    </form>
</div>
<!-- 自定义数字键盘容器 -->
<div id="custom-keyboard" style="display:none"></div>
<footer class="text-center text-muted small py-3" style="background: #f8f9fa;">
    <div>
        <a href="https://github.com/senzi/quickmath-flask" target="_blank">GitHub仓库</a> |
        <a href="https://weibo.com/7402396589/Pq4W2E7rk" target="_blank">@阿尼亚是安妮亞</a> |
        <span>MIT License</span>
    </div>
</footer>
<script src="./js/quiz.js"></script>
<script>
// 题型生成函数示例（可根据需要扩展）
function generateQuestion(type, id) {
    if (type === '4div4_choice') {
        // 四位数除法速算选择题
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        function randFloat(min, max) {
            return Math.random() * (max - min) + min;
        }
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        const A = randInt(1000, 9999);
        const B = randInt(1000, 9999);
        const result = +(A / B).toFixed(2);
        const optionsSet = new Set([result]);
        while (optionsSet.size < 4) {
            let noise = +(result + randFloat(-2, 2)).toFixed(2);
            if (noise !== result && noise > 0) {
                optionsSet.add(noise);
            }
        }
        const options = shuffle(Array.from(optionsSet).map(n => n.toFixed(2)));
        return {
            id,
            type,
            A,
            B,
            question: `${A} ÷ ${B} = ?`,
            answer: result.toFixed(2),
            options
        };
    } else if (type === 'mul2x1') {
        // 两位数 × 一位数乘法
        const a = Math.floor(Math.random() * 90 + 10); // 10~99
        const b = Math.floor(Math.random() * 9 + 1);   // 1~9
        return {
            id,
            type,
            stem: `${a} × ${b} = `,
            answer: (a * b).toString()
        };
    } else if (type === 'addsub2') {
        // 两位数加减混合，答两个
        const a = Math.floor(Math.random() * 90 + 10);
        const b = Math.floor(Math.random() * 90 + 10);
        return {
            id,
            type,
            stem: `${a}  ${b}`,
            answer: [a + b, a - b]
        };
    } else if (type === 'addsub3') {
        // 三位数加减混合，答两个
        const a = Math.floor(Math.random() * 900 + 100);
        const b = Math.floor(Math.random() * 900 + 100);
        return {
            id,
            type,
            stem: `${a}  ${b}`,
            answer: [a + b, a - b]
        };
    } else if (type === 'div2') {
        // 多位 ÷ 两位，答商首位
        const divisor = Math.floor(Math.random() * 90 + 10);
        const quotient = Math.floor(Math.random() * 90 + 10);
        const dividend = divisor * quotient + Math.floor(Math.random() * divisor);
        return {
            id,
            type,
            stem: `${dividend} ÷ ${divisor} = `,
            answer: quotient.toString()[0]
        };
    } else if (type === 'div3') {
        // 多位 ÷ 三位，答商前两位
        const divisor = Math.floor(Math.random() * 900 + 100);
        const quotient = Math.floor(Math.random() * 90 + 10);
        const dividend = divisor * quotient + Math.floor(Math.random() * divisor);
        return {
            id,
            type,
            stem: `${dividend} ÷ ${divisor} = `,
            answer: quotient.toString().padStart(2, '0').slice(0,2)
        };
    }
    return null;
}

// 渲染题目
function renderQuestions(questions) {
    const list = document.getElementById('questions-list');
    list.innerHTML = '';
    questions.forEach((q, idx) => {
        let inputHtml = '';
        if (q.type === '4div4_choice') {
            // 渲染四除四选择题
            const optionLabels = ['A', 'B', 'C', 'D'];
            let saved = localStorage.getItem('quickmath-answer_' + q.id) || '';
            inputHtml = `
                <div class="d-flex justify-content-end gap-2 flex-wrap">
                    ${q.options.map((opt, i) => `
                        <button type="button"
                            class="btn btn-outline-primary quiz-choice-btn${saved === opt ? ' active' : ''}"
                            data-qid="${q.id}"
                            data-value="${opt}"
                            style="min-width:56px"
                        >${optionLabels[i]}. ${opt}</button>
                    `).join('')}
                </div>
                <input type="hidden" name="answer_${q.id}" value="${saved}">
            `;
        } else if (q.type === 'addsub2' || q.type === 'addsub3') {
            inputHtml = `
                <div class="d-flex justify-content-end gap-2">
                    <input type="text" class="form-control answer-input quiz-input" name="answer_${q.id}_1" autocomplete="off" placeholder="加">
                    <input type="text" class="form-control answer-input quiz-input" name="answer_${q.id}_2" autocomplete="off" placeholder="减">
                </div>
            `;
        } else if (q.type === 'div2') {
            inputHtml = `
                <div class="d-flex justify-content-end">
                    <input type="text" class="form-control answer-input quiz-input" name="answer_${q.id}" autocomplete="off" placeholder="首位">
                </div>
            `;
        } else if (q.type === 'div3') {
            inputHtml = `
                <div class="d-flex justify-content-end">
                    <input type="text" class="form-control answer-input quiz-input" name="answer_${q.id}" autocomplete="off" placeholder="两位">
                </div>
            `;
        } else {
            inputHtml = `
                <div class="d-flex justify-content-end">
                    <input type="text" class="form-control answer-input quiz-input" name="answer_${q.id}" autocomplete="off">
                </div>
            `;
        }
        // 题干兼容
        let stem = typeof q.stem === "string" ? q.stem : (q.question || '');
        list.innerHTML += `
            <div class="card mb-3 quiz-card mx-auto" style="max-width: 600px;">
                <div class="card-body py-3">
                    <div class="row align-items-center">
                        <div class="col-auto d-flex align-items-center">
                            <span class="badge bg-secondary me-3">题${idx + 1}</span>
                            <span class="quiz-stem">${stem}</span>
                        </div>
                        <div class="col text-end">
                            ${inputHtml}
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    // 绑定选择题按钮事件
    document.querySelectorAll('.quiz-choice-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const qid = this.getAttribute('data-qid');
            const value = this.getAttribute('data-value');
            // 取消同题其他按钮高亮
            document.querySelectorAll(`.quiz-choice-btn[data-qid="${qid}"]`).forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            // 设置隐藏域
            const hidden = document.querySelector(`input[name="answer_${qid}"]`);
            if (hidden) hidden.value = value;
            // 保存到localStorage
            localStorage.setItem('quickmath-answer_' + qid, value);
        });
    });
}

// 入口逻辑
(function() {
    // 读取配置
    let config = localStorage.getItem('quickmath_config');
    if (!config) {
        alert('未找到题目配置，请先选择题型');
        window.location.href = 'index.html';
        return;
    }
    config = JSON.parse(config);
    // 生成题目
    let questions = [];
    let id = 1;
    config.modules.forEach(mod => {
        for (let i = 0; i < mod.count; i++) {
            questions.push(generateQuestion(mod.type, id++));
        }
    });
    // 乱序
    if (config.shuffle) {
        questions = questions.sort(() => Math.random() - 0.5);
    }
    // 保存题目到 localStorage
    localStorage.setItem('quickmath_current', JSON.stringify({
        questions,
        start: new Date().toISOString()
    }));
    // 渲染
    renderQuestions(questions);
    // 计时器、输入自动保存等由 quiz.js 负责
    // 提交事件
    document.getElementById('quiz-form').addEventListener('submit', function(e) {
        e.preventDefault();
        // 保存当前答案
        const answers = {};
        document.querySelectorAll('input[name^="answer_"]').forEach(input => {
            answers[input.name] = input.value;
        });
        // 记录用时
        const elapsed = parseInt(localStorage.getItem('quickmath-timer') || '0');
        // 更新 current
        let current = JSON.parse(localStorage.getItem('quickmath_current'));
        current.userAnswers = answers;
        current.elapsed = elapsed;
        localStorage.setItem('quickmath_current', JSON.stringify(current));
        window.location.href = 'result.html';
    });
})();
</script>
</body>
</html>
