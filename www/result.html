<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>QuickMath - 批卷结果</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div class="container mt-4 d-flex flex-column align-items-center">
    <h2 class="mb-3 text-center">批卷结果</h2>
    <div class="quiz-card card p-4 mb-4" style="max-width: 520px;">
        <div class="mb-3 text-center" id="score-bar">
            <!-- 得分、正确率 -->
        </div>
        <div class="d-flex flex-column align-items-center gap-2 mb-3">
            <a href="index.html" class="btn btn-outline-primary w-75">返回首页</a>
            <a href="history.html" class="btn btn-outline-secondary w-75">历史记录</a>
        </div>
        <div id="result-list">
            <!-- 批改结果 -->
        </div>
    </div>
</div>
<footer class="text-center text-muted small py-3" style="background: #f8f9fa;">
    <div>
        <a href="https://github.com/senzi/quickmath-flask" target="_blank">GitHub仓库</a> |
        <a href="https://weibo.com/7402396589/Pq4W2E7rk" target="_blank">@阿尼亚是安妮亞</a> |
        <span>MIT License</span>
    </div>
</footer>
<script>
function formatAnswer(type, ans) {
    if (type === 'addsub2' || type === 'addsub3') {
        if (!ans) return '未作答';
        return `加 ${ans[0] ?? ''}，减 ${ans[1] ?? ''}`;
    }
    return ans ?? '未作答';
}
(function() {
    // 读取当前答题
    let current = localStorage.getItem('quickmath_current');
    if (!current) {
        alert('未找到答题记录，请先答题');
        window.location.href = 'index.html';
        return;
    }
    current = JSON.parse(current);
    const questions = current.questions || [];
    const userAnswers = current.userAnswers || {};
    // 批改
    let correct = 0;
    const results = [];
    questions.forEach((q, idx) => {
        let is_correct = false;
        let user_ans;
        if (q.type === 'addsub2' || q.type === 'addsub3') {
            user_ans = [
                userAnswers[`answer_${q.id}_1`] ?? '',
                userAnswers[`answer_${q.id}_2`] ?? ''
            ];
            is_correct = (user_ans[0] == q.answer[0] && user_ans[1] == q.answer[1]);
        } else {
            user_ans = userAnswers[`answer_${q.id}`] ?? '';
            is_correct = (user_ans == q.answer);
        }
        if (is_correct) correct++;
        results.push({
            idx: idx + 1,
            type: q.type,
            stem: q.stem,
            user_answer: user_ans,
            answer: q.answer,
            is_correct,
            ...(q.type === '4div4_choice' ? {
                options: q.options,
                question: (typeof q.question !== 'undefined' && q.question !== null)
                    ? q.question
                    : (typeof q.A !== 'undefined' && typeof q.B !== 'undefined'
                        ? `${q.A} ÷ ${q.B} = ?`
                        : '')
            } : {})
        });
    });
    // 统计
    const total = questions.length;
    const percent = total ? Math.round(correct * 100 / total) : 0;
    // 渲染分数
    document.getElementById('score-bar').innerHTML = `
        <span class="badge bg-success">得分：${correct}/${total}</span>
        <span class="badge bg-primary ms-2">正确率：${percent}%</span>
    `;
    // 渲染每题
    const list = document.getElementById('result-list');
    results.forEach(r => {
        let answerHtml = '';
        if (r.type === '4div4_choice') {
            // 四除四选择题：渲染选项按钮并高亮
            const optionLabels = ['A', 'B', 'C', 'D'];
            const options = r.options || [];
            const userAns = r.user_answer || '';
            const correctAns = r.answer;
            answerHtml = `
                <div class="d-flex gap-2 flex-wrap">
                    ${options.map((opt, i) => {
                        let btnClass = "btn btn-outline-primary";
                        if (userAns === opt && userAns === correctAns) {
                            btnClass += " border-success text-success fw-bold";
                        } else if (userAns === opt && userAns !== correctAns) {
                            btnClass += " border-danger text-danger fw-bold";
                        } else if (opt === correctAns) {
                            btnClass += " border-success text-success";
                        }
                        return `<span class="${btnClass}" style="min-width:70px;pointer-events:none;">
                            ${optionLabels[i]}. ${opt}
                        </span>`;
                    }).join('')}
                </div>
                <div class="mt-1">
                    <span>你的答案：${userAns || '未作答'}</span>
                    <span class="ms-3">正确答案：${correctAns}</span>
                </div>
            `;
        } else if (r.type === 'addsub2' || r.type === 'addsub3') {
            answerHtml = `
                <span>你的答案：加 ${r.user_answer[0] ?? ''}，减 ${r.user_answer[1] ?? ''}</span>
                <span class="ms-3">正确答案：加 ${r.answer[0]}，减 ${r.answer[1]}</span>
            `;
        } else {
            answerHtml = `
                <span>你的答案：${r.user_answer || '未作答'}</span>
                <span class="ms-3">正确答案：${r.answer}</span>
            `;
        }
        // 题干兼容
        let stem = '';
        if (typeof r.stem !== 'undefined' && r.stem !== null) {
            stem = r.stem;
        } else if (typeof r.question !== 'undefined' && r.question !== null) {
            stem = r.question;
        } else if (r.type === '4div4_choice' && typeof r.A !== 'undefined' && typeof r.B !== 'undefined') {
            stem = `${r.A} ÷ ${r.B} = ?`;
        } else {
            stem = '';
        }
        list.innerHTML += `
            <div class="card mb-2 quiz-card" style="max-width: 480px;">
                <div class="card-body py-2">
                    <div class="row align-items-center">
                        <div class="col-auto d-flex align-items-center">
                            <span class="badge bg-secondary me-3">题${r.idx}</span>
                            <span class="quiz-stem">${stem}</span>
                        </div>
                        <div class="col text-end">
                            ${r.is_correct
                                ? '<span class="badge bg-success">✔ 正确</span>'
                                : '<span class="badge bg-danger">✘ 错误</span>'}
                        </div>
                    </div>
                    <div class="mt-2 small text-muted">
                        ${answerHtml}
                    </div>
                </div>
            </div>
        `;
    });
    // 保存到历史
    let history = [];
    try {
        history = JSON.parse(localStorage.getItem('quickmath_history') || '[]');
    } catch {}
    history.push({
        date: new Date().toLocaleString(),
        username: localStorage.getItem('quickmath_username') || '',
        modules: (JSON.parse(localStorage.getItem('quickmath_config')) || {}).modules || [],
        questions,
        userAnswers,
        score: `${correct}/${total}`,
        percent
    });
    localStorage.setItem('quickmath_history', JSON.stringify(history));
})();
</script>
</body>
</html>
